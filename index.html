<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Starship Letters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="target-panel">
      <div id="target-label">Find and shoot:</div>
      <div id="target-letter">A</div>
      <div id="score-label">Score: <span id="score">0</span></div>
      <div id="ship-control">
        <div id="ship-count-label">Ships: <span id="ship-count">3</span></div>
        <button id="btn-more-ships" class="panel-btn">More Ships +</button>
      </div>
      <div id="speed-control">
        <div id="speed-label">Speed: <span id="speed-value">1.0x</span></div>
        <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div id="mode-control">
        <button id="btn-mode-toggle" class="panel-btn">&#128266; Listening Mode</button>
        <button id="btn-replay-sound" class="panel-btn" hidden>&#128257; Hear it again</button>
        <select id="voice-select" class="panel-select" hidden></select>
      </div>
      <div id="crossfire-control">
        <button id="btn-crossfire-toggle" class="panel-btn">&#128760; Crossfire Mode</button>
      </div>
      <div id="letters-control">
        <button id="btn-lowercase-toggle" class="panel-btn">&#128289; Add Lowercase</button>
        <button id="btn-numbers-toggle" class="panel-btn">&#128290; Add Numbers</button>
      </div>
      <div id="status-message"></div>
    </aside>

    <main id="game-area">
      <canvas id="game-canvas" width="480" height="600"></canvas>
      <div id="touch-controls">
        <button id="btn-left" class="touch-btn" aria-label="Move left">&#8592;</button>
        <button id="btn-fire" class="touch-btn" aria-label="Fire">&#9679;</button>
        <button id="btn-right" class="touch-btn" aria-label="Move right">&#8594;</button>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
